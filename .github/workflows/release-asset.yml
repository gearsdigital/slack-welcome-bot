name: Attach plugin ZIP to release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      - name: Build plugin ZIP
        run: |
          mkdir -p build/slack-welcome-bot
          cp slack-welcome-bot.php uninstall.php README.md build/slack-welcome-bot/
          cp -R includes vendor build/slack-welcome-bot/
          cd build
          zip -qr slack-welcome-bot.zip slack-welcome-bot

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" build/slack-welcome-bot.zip --clobber
